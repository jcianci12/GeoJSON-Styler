<!-- {{ ruletype | json }} -->

<div class="row">
  <div class="col" *ngFor="let item of propertylist">
    <mat-form-field class="example-full-width" *ngIf="gettype(item) == 'string'">
      <mat-label>{{ item }}</mat-label>
      <input title="String Input" matInput [type]="gettype(item)" [value]="getProperty(item)" (change)="setProperty($event, item)" />
    </mat-form-field>
    <ng-container *ngIf="gettype(item) == 'number'">
      <mat-label>{{ item }}</mat-label>
      <mat-slider min="0" max="1" step="0.01" [value]="getNumberProperty(item)" (input)="setProperty($event, item)" (change)="setProperty($event, item)"></mat-slider>
    </ng-container>
    <ng-container *ngIf="gettype(item) == 'boolean'">
      <!-- used for dynamic styling -->
      <mat-checkbox class="example-margin" [checked]="getProperty(item)"  (change)="setProperty($event, item)">
        {{ item }}
      </mat-checkbox>
    </ng-container>

  </div>
</div>
