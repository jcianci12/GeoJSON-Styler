<mat-accordion>
  <mat-expansion-panel [expanded]="false">
    <mat-expansion-panel-header>
      <mat-panel-title>
        Preview Data ({{ dataLength }} rows)
      </mat-panel-title>
      <mat-panel-description>
        <span *ngIf="editMode" class="edit-indicator">Editing Mode</span>
      </mat-panel-description>
    </mat-expansion-panel-header>

    <!-- Edit Controls -->
    <div class="edit-controls" *ngIf="d">
      <button mat-raised-button color="primary" *ngIf="!editMode" (click)="toggleEditMode()">
        <mat-icon>edit</mat-icon>
        Edit Table
      </button>
      <div *ngIf="editMode" class="edit-buttons">
        <button mat-raised-button color="primary" (click)="saveChanges()">
          <mat-icon>save</mat-icon>
          Save
        </button>
        <button mat-raised-button color="warn" (click)="cancelEdit()">
          <mat-icon>cancel</mat-icon>
          Cancel
        </button>
        <button mat-raised-button color="accent" (click)="addRow()">
          <mat-icon>add</mat-icon>
          Add Row
        </button>
      </div>
    </div>

    <!-- Read-only table -->
    <table class="table" *ngIf="d && !editMode">
      <tbody>
        <tr *ngFor="let row of d | csvtojson; let i = index; trackBy: trackByIndex" [class.header-row]="i === 0">
          <td *ngFor="let cell of row; trackBy: trackByIndex">{{ cell }}</td>
        </tr>
      </tbody>
    </table>

    <!-- Editable table -->
    <table class="table editable-table" *ngIf="editMode && editableData.length > 0">
      <tbody>
        <tr *ngFor="let row of editableData; let rowIndex = index; trackBy: trackByIndex"
            [class.header-row]="rowIndex === 0">
          <td *ngFor="let cell of row; let cellIndex = index; trackBy: trackByIndex" class="editable-cell">
            <mat-form-field appearance="outline" class="cell-input" *ngIf="rowIndex === 0">
              <input matInput [(ngModel)]="editableData[rowIndex][cellIndex]"
                     placeholder="Header" class="header-input">
            </mat-form-field>
            <mat-form-field appearance="outline" class="cell-input" *ngIf="rowIndex > 0">
              <input matInput [(ngModel)]="editableData[rowIndex][cellIndex]"
                     placeholder="Enter value">
            </mat-form-field>
          </td>
          <td *ngIf="rowIndex > 0" class="action-cell">
            <button mat-icon-button color="warn" (click)="removeRow(rowIndex)"
                    matTooltip="Delete row">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </mat-expansion-panel>
</mat-accordion>
