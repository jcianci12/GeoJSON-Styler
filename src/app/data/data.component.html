<div class="row">
  <div class="col">
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title> GEOJson </mat-panel-title>
        <mat-panel-description> </mat-panel-description>
      </mat-expansion-panel-header>

      <app-geojsonselector [layerindex]="this.featurecollectionlayerindex"></app-geojsonselector>
      <br />
       <app-featurelist [layerIndex]="featurecollectionlayerindex"></app-featurelist>    </mat-expansion-panel>
    <!-- {{featurecollectionlayerindex}}
    {{stylerules|json}} -->
  </div>
</div>
<div class="row">
  <div class="col">
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title> Styling Data</mat-panel-title>
        <mat-panel-description> </mat-panel-description>
      </mat-expansion-panel-header>

      <div class="row">
        <div class="col" style="border-style: hidden hidden hidden dotted">
          <p>You can choose a CSV upload or JSON from a data endpoint.</p>
          <mat-tab-group>
            <mat-tab label="CSV">
              <p>Choose the csv formatted data you would like to use.</p>
              <app-fileupload [fileextension]="'csv,xlsx'" (fileadded)="addData($event)"></app-fileupload>
              
              
            </mat-tab>
            <mat-tab label="Paste">
              <p>Paste tab, comma, or space-separated data below.</p>
              <textarea
                [(ngModel)]="pasteData"
                placeholder="LGA&#9;Colour&#10;Brisbane (North)&#9;Green&#10;Gold Coast Council&#9;Green"
                rows="6"
                style="width: 100%; font-family: monospace; font-size: 13px; padding: 8px;">
              </textarea>
              <button mat-stroked-button color="primary" (click)="applyPasteData()" 
                      [disabled]="!pasteData.trim()"
                      style="margin-top: 8px;">
                Update Layer
              </button>
            </mat-tab>
            <mat-tab label="JSON">
              <app-jsonendpoint [endpointurl]="endpointurl" (dataChange)="addJSONData($event)"></app-jsonendpoint>
            </mat-tab>

          </mat-tab-group>
          <app-datatable [d]="d"></app-datatable>

        </div>
      </div>

      <div class="row">
        <div class="col" style="border-style: hidden hidden hidden dotted">
          <h1>Data layers</h1>
          <p>Choose the column to join on (Eg. The suburb column)</p>
          <app-geocolumn [featureCollectionIndex]="featurecollectionlayerindex"
            [tableheaders]="d | csvtojson | tableheaders"
            (geocolumnChange)="onGeocolumnChange($event)"></app-geocolumn>
          
          <!-- Add joined rows summary -->
          <div *ngIf="joinedRowsCount > 0" class="joined-summary">
            <p><strong>Joined {{ joinedRowsCount }} rows</strong></p>
          </div>

        </div>
      </div>
      <div class="row"> <app-stylerule (stylerulesChange)="updateStyleRules($event)"
            [stylerules]="featureCollectionLayers[this.featurecollectionlayerindex].stylerules"
            [tableheaders]="d | csvtojson | tableheaders" [featureCollectionIndex]="featurecollectionlayerindex">
          </app-stylerule>
        <div class="col">
         
          <!-- {{featurecollectionlayerindex}}
          {{stylerules|json}} -->
        </div>
      </div>
    </mat-expansion-panel>
    <!-- {{featurecollectionlayerindex}}
    {{stylerules|json}} -->
  </div>
</div>
