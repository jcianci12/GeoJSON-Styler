<p>
  <mat-toolbar>

    <span>
      <h1>GeoJSON Styler</h1>
    </span>
    <span class="example-spacer"></span>
    <button mat-button [matMenuTriggerFor]="menu">Load/Save Map State</button>
    <mat-menu #menu="matMenu">
      <app-loadsavebutton></app-loadsavebutton>

    </mat-menu>
    <button mat-button color="primary" (click)="addLayer()">Add layer</button>


  </mat-toolbar>
</p>

<div>
  <div class="container-fluid" style="min-height: 100vh">
    <div class="row">
      <div class="col">
      </div>
    </div>
    <div class="row">
      <div class="col-6">

        <mat-accordion>
          <mat-expansion-panel [expanded]="expanded | async">
            <mat-expansion-panel-header>

              <mat-panel-description> </mat-panel-description>
            </mat-expansion-panel-header>

            <ng-container *ngFor="
                let featureCollection of featureCollectionLayers;
                let i = index
              ">
              <!-- Raw feature collection  -->
              <!-- {{featureCollection|json}} -->
              <!-- GeoJson converted from feature collection -->
              <div class="row">
                <div class="col">
                  <mat-checkbox class="example-margin" [checked]="featureCollection.active"
                    (change)="updateActive($event,i)">Active</mat-checkbox>
                  <mat-radio-group class="mx-2"
                    [(ngModel)]="featureCollection.layerType"
                    (change)="onLayerTypeChange(i)">
                    <mat-radio-button value="geojson">GeoJSON</mat-radio-button>
                    <mat-radio-button class="ms-2" value="csv">CSV Points</mat-radio-button>
                  </mat-radio-group>
                </div>
                <div class="col float-right">
                  <button class="" mat-button color="primary" aria-label="Example icon button with a menu icon">
                    <mat-icon (click)="removeLayer(i)">delete</mat-icon>
                  </button>
                </div>
              </div>
              <mat-expansion-panel [expanded]="true">
                <mat-expansion-panel-header>
                  <mat-panel-title> Styling </mat-panel-title>
                  <mat-panel-description> </mat-panel-description>
                </mat-expansion-panel-header>

                <div class="row">
                  <div class="col">
                    <ng-container [ngSwitch]="featureCollection.layerType">
                      <app-data *ngSwitchCase="'geojson'"
                        [featurecollectionlayerindex]="i">
                      </app-data>
                      <div *ngSwitchCase="'csv'">
                        <app-latlng-column
                          [csvData]="csvData"
                          [headers]="headers"
                          [featurecollectionlayerindex]="i"
                          (testPoints)="onTestPointsAdded($any($event).detail)">
                        </app-latlng-column>
                      </div>
                    </ng-container>
                  </div>
                </div>
              </mat-expansion-panel>

              <!-- Processed GeoJSON Output for this layer -->
              <!-- <mat-expansion-panel [expanded]="false">
                <mat-expansion-panel-header>
                  <mat-panel-title> Processed GeoJSON (Layer {{i}}) </mat-panel-title>
                  <mat-panel-description> Click to view styled GeoJSON </mat-panel-description>
                </mat-expansion-panel-header>
                <div style="max-height: 300px; overflow-y: auto; background-color: #f5f5f5; padding: 10px; border-radius: 4px;">
                  <pre style="margin: 0; font-size: 12px;">{{getLayerGeoJson(i)|json}}</pre>
                </div>
              </mat-expansion-panel> -->



            </ng-container>
          </mat-expansion-panel>

          <!-- Combined GeoJSON Output -->
          <!-- <mat-expansion-panel [expanded]="false">
            <mat-expansion-panel-header>
              <mat-panel-title> Combined GeoJSON Output </mat-panel-title>
              <mat-panel-description> All active layers with styling applied </mat-panel-description>
            </mat-expansion-panel-header>
            <div style="max-height: 400px; overflow-y: auto; background-color: #f5f5f5; padding: 10px; border-radius: 4px;">
              <pre style="margin: 0; font-size: 12px;">{{processedGeoJson|json}}</pre>
            </div>
          </mat-expansion-panel> -->
        </mat-accordion>

        <!-- {{term|json}} -->
      </div>

      <div class="col-6" style="min-height: 80vh;max-height: 800px;">
        <div class="map-container">
          <div class="map-frame">
            <app-map (map$)="receiveMap($event)" (zoom$)="receiveZoom($event)" id="main-map"></app-map>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- {{geojsondata?.features|json}} -->
